name: khmer_ai_assistant
description: "Khmer-first AI assistant for everyday Cambodian users."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: 3.2.1
  riverpod_annotation: 4.0.2
  go_router: ^17.5.0
  intl: 0.20.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_markdown_plus: ^1.0.12
  json_annotation: ^4.11.0
  package_info_plus: ^10.2.2
  connectivity_plus: ^7.3.2
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  riverpod_generator: 4.0.3
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  fonts:
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer.ttf
